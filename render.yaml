# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via: Render Dashboard → New → Blueprint → connect this repo
#

services:
  - type: web
    name: hacker-tracker-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    preDeployCommand: sh /app/scripts/migrate.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hacker-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: FRONTEND_URL
        sync: false          # set manually to your Firebase Hosting URL
      - key: CORS_ORIGINS
        sync: false
        # REQUIRED: JSON array of allowed origins. Example:
        # ["https://hacker-tracker-75f91.web.app"]
        # App will refuse to start if this contains localhost in production.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # paste the full JSON of your service-account.json here
        # Startup writes it to a temp file and points GOOGLE_APPLICATION_CREDENTIALS
        # there, so don't set GOOGLE_APPLICATION_CREDENTIALS on Render.
      - key: NVD_API_KEY
        sync: false          # set manually in dashboard; rotate at NIST
      - key: CENSUS_API_KEY
        sync: false          # set manually in dashboard; rotate at Census
      - key: GEMINI_API_KEY
        sync: false          # set manually in dashboard; AI summary (template fallback if blank)
      # GEMINI_MODEL is deliberately not set: the code default (gemini-3.6-flash)
      # is the model the eval measured. A dashboard override would bypass it.
      - key: SENTRY_DSN
        sync: false          # set manually in dashboard; backend error tracking (no-op if blank)
      - key: SENTRY_ENVIRONMENT
        value: production
      # Ingest schedules are code defaults in backend/app/core/config.py
      # (NVD 01:00, KEV 01:15, EPSS 02:00 UTC, economics 03:00 UTC, all daily). Set
      # INGEST_SCHEDULE_* here only to override them; an empty value disables that source
      # (it then reports "disabled").
      # IC3 is static (annual-report seed): it has no schedule and is never refreshed for age (seeded only if its table is empty).
      # See docs/runbooks/ingest-freshness.md.
      # INGEST_CATCHUP_ON_STARTUP defaults on: a restart re-runs any stale scheduled source.
      # SCHEDULER_ENABLED=false is the local-dev opt-out. Do not set it on this service,
      # or no scheduled ingest runs in production.
      # RATE_LIMIT_TRUST_X_FORWARDED_FOR (default false) makes per-IP rate limits key on the
      # client instead of Render's proxy. Enable it only after the spoof check in
      # docs/runbooks/ingest-freshness.md ("Rate-limit client IP").

databases:
  - name: hacker-tracker-db
    plan: free
    databaseName: cyber_threat_db
    postgresMajorVersion: "15"
