# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via: Render Dashboard → New → Blueprint → connect this repo
#

services:
  - type: web
    name: hacker-tracker-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    preDeployCommand: sh /app/scripts/migrate.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hacker-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_URL
        sync: false          # set manually to your Firebase Hosting URL
      - key: CORS_ORIGINS
        sync: false
        # REQUIRED: JSON array of allowed origins. Example:
        # ["https://hacker-tracker-75f91.web.app"]
        # App will refuse to start if this contains localhost in production.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /app/service-account.json
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # paste the full JSON of your service-account.json here

databases:
  - name: hacker-tracker-db
    plan: free
    databaseName: cyber_threat_db
    postgresMajorVersion: "15"
