[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen with dataset v1 (S5a provenance): the generator's bytes are hashed into MANIFEST.json.
extend-exclude = [
  "evals/ai_summary/dataset/generate_v1.py",
  "evals/ai_summary/attack_strings.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "BLE", "FBT", "A", "C4"]
ignore = ["E501", "A003"]  # E501: line length (formatter handles); A003: Pydantic `id` fields shadow builtin

[tool.pylint."MAIN"]
init-hook = "import sys; from pathlib import Path; sys.path.insert(0, str(Path(__file__).resolve().parent))"

[tool.pylint.messages_control]
disable = [
    "not-callable",           # E1102: SQLAlchemy func.* is callable at runtime
    "unnecessary-ellipsis",   # W2301: Protocol bodies use ...
    "global-statement",       # W0603: intentional singleton in get_exploited_repo
]
