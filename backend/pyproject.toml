[tool.poetry]
name = "cyber-threat-intelligence"
version = "0.1.0"
description = "Cyber Threat Intelligence & Anomaly Detection Platform"
authors = ["Your Team <your-email@example.com>"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
pdfplumber = "^0.11.9"
ruff = "^0.1.11"
psycopg2-binary = "^2.9.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "BLE", "FBT", "A", "C4"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.pylint."MAIN"]
init-hook = "import sys; from pathlib import Path; sys.path.insert(0, str(Path(__file__).resolve().parent))"

[tool.pylint.messages_control]
disable = [
    "not-callable",           # E1102: SQLAlchemy func.* is callable at runtime
    "unnecessary-ellipsis",   # W2301: Protocol bodies use ...
    "global-statement",       # W0603: intentional singleton in get_exploited_repo
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
