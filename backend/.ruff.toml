[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "BLE", "FBT", "A", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "sqlalchemy", "pydantic"]
