[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# One event loop for the whole session: the app's SQLAlchemy engine is a module-level
# singleton whose asyncpg connections are bound to the loop that created them.
# (pytest-asyncio >= 1.0 removed the overridable event_loop fixture.)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Minimal output
addopts = -v --tb=short
