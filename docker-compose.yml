version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cyber_threat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyber_threat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyber_threat_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_threat_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyber_threat_db
      APP_ENV: development
      APP_NAME: Cyber Threat Intelligence Platform
      API_PREFIX: /api/v1
      LOG_LEVEL: DEBUG
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cyber_threat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cyber_threat_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    command: npm run dev
    networks:
      - cyber_threat_network

volumes:
  postgres_data:

networks:
  cyber_threat_network:
    driver: bridge
