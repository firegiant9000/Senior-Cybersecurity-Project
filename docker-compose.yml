services:
  postgres:
    image: postgres:15-alpine
    container_name: cyber_threat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyber_threat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyber_threat_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_threat_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cyber_threat_db
      APP_ENV: development
      APP_NAME: Cyber Threat Intelligence Platform
      API_PREFIX: /api/v1
      LOG_LEVEL: DEBUG
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      FRONTEND_URL: http://localhost:5174
      CORS_ORIGINS: '["http://localhost:5174"]'
      # Put your own Firebase Admin key at backend/service-account.json (gitignored).
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
      - ./backend/service-account.json:/app/service-account.json
      - backend_uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cyber_threat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cyber_threat_frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # Firebase web config comes from ./frontend/.env (see frontend/.env.example).
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_USE_POLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend/.env:/app/.env
      - ./frontend/public:/app/public
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    command: npm run dev
    networks:
      - cyber_threat_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  cyber_threat_network:
    driver: bridge
