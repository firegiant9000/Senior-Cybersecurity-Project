# Builds, attests and releases the read-only Linux host scanner (agent/) on a
# tag push of the form `agent-vX.Y.Z`.
#
# Flow: build (vet, test, binary govulncheck, CycloneDX SBOMs, SHA256SUMS,
# SLSA build provenance + SBOM attestations) -> publish a DRAFT release ->
# verify the draft exactly as a consumer would (gh attestation verify, plus a
# tampered-binary self-test) -> undraft. No secrets are used; trust comes from
# GitHub's OIDC-backed attestations, not a long-lived signing key.
#
# Manual dispatch never creates a tag or a lasting release. A plain dispatch
# only builds and verifies the run artifact; `rehearse` also creates a draft
# release, verifies it, and deletes it again.
#
# How to verify a release: docs/security/agent_release_verification.md
name: Agent Release

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Rehearse the release path: creates a draft release, verifies it and deletes it again. Pushes no tag."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build, scan and attest Linux binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless signing for the attestations
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Only a tag PUSH may take the real-release path. A dispatch on a tag ref
      # would otherwise be treated as a real release.
      - name: Refuse dispatch from a tag
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::dispatch from a branch, not a tag (ref is ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false # stdlib-only module, no go.sum to key a cache on

      # Derive the release version from the tag (agent-v0.2.0 -> 0.2.0). For a
      # manual dispatch with no tag we fall back to 0.0.0-dev so ldflags still
      # has a clean semver to stamp.
      - name: Resolve version
        id: version
        run: |
          REF="${GITHUB_REF}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${REF}" == refs/tags/agent-v* ]]; then
            VERSION="${REF#refs/tags/agent-v}"
          else
            VERSION="0.0.0-dev"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag version '${VERSION}' is not a clean semver (expected agent-vX.Y.Z)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building agent version ${VERSION}"

      # Guard against scanner_version drift: the stamped tag must match the source
      # default in internal/output (the value the backend's MIN_AGENT_VERSION
      # gate compares against). Skip the check for dev dispatch builds.
      - name: Verify tag matches source ScannerVersion
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SRC=$(grep -oE 'ScannerVersion = "[^"]+"' internal/output/json.go | grep -oE '[0-9][^"]*')
          if [ "${SRC}" != "${VERSION}" ]; then
            echo "::error::Tag agent-v${VERSION} != source ScannerVersion ${SRC}. Bump internal/output/json.go before tagging."
            exit 1
          fi
          echo "ScannerVersion ${SRC} matches tag."

      - name: Vet & test
        working-directory: agent
        run: |
          go vet ./...
          go test ./...

      - name: Build (linux/amd64 + linux/arm64)
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dist"
          LDFLAGS="-s -w -X github.com/firegiant9000/hacker-tracker/agent/internal/output.ScannerVersion=${VERSION}"
          for arch in amd64 arm64; do
            out="${RUNNER_TEMP}/dist/hacker-tracker-${VERSION}-linux-${arch}"
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" ./cmd/hacker-tracker
          done

      - name: Install govulncheck and cyclonedx-gomod
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Scans the shipped binaries themselves (the symbols they actually link),
      # not just the module graph. Blocking.
      - name: govulncheck (binaries)
        run: |
          set -euo pipefail
          for f in "${RUNNER_TEMP}"/dist/hacker-tracker-*-linux-*; do
            echo "==> ${f}"
            govulncheck -mode binary "${f}"
          done

      # `-version` overrides the "(devel)" main-module version that binaries
      # built from a checkout carry; check_sbom.py fails if it did not take.
      - name: CycloneDX SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          GOVERSION="$(go env GOVERSION)"
          for f in "${RUNNER_TEMP}"/dist/hacker-tracker-*-linux-*; do
            echo "==> ${f}.cdx.json"
            cyclonedx-gomod bin -json -std -version "v${VERSION}" -output "${f}.cdx.json" "${f}"
            python3 .github/scripts/check_sbom.py "${f}.cdx.json" --version "v${VERSION}" --go-version "${GOVERSION}"
          done

      - name: Generate checksums
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          sha256sum hacker-tracker-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64
            ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64

      - name: Attest SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64
          sbom-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64.cdx.json

      - name: Attest SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64
          sbom-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64.cdx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # Creates the release as a DRAFT. Nothing is public until `verify` passes.
  # Needs contents: write and nothing else (no id-token), so the job that can
  # write releases can never mint attestations.
  publish:
    name: Create draft release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || inputs.rehearse
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      REHEARSE: ${{ inputs.rehearse }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-linux-${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        run: |
          set -euo pipefail
          GO_VERSION="$(jq -r '.components[] | select(.name == "std") | .version' "dist/hacker-tracker-${VERSION}-linux-amd64.cdx.json")"
          test -n "${GO_VERSION}"
          cat > body.md <<EOF
          Read-only Linux host scanner ${VERSION}, built with ${GO_VERSION}.

          Artifacts: \`linux/amd64\` and \`linux/arm64\` binaries, a CycloneDX SBOM for each (\`.cdx.json\`), and \`SHA256SUMS\`.

          Verify before you run it:

          \`\`\`
          gh release download ${GITHUB_REF_NAME} --repo firegiant9000/Senior-Cybersecurity-Project
          gh attestation verify hacker-tracker-${VERSION}-linux-amd64 \\
            --repo firegiant9000/Senior-Cybersecurity-Project \\
            --signer-workflow firegiant9000/Senior-Cybersecurity-Project/.github/workflows/agent-release.yml \\
            --source-ref ${GITHUB_REF} \\
            --deny-self-hosted-runners
          gh attestation verify hacker-tracker-${VERSION}-linux-amd64 \\
            --repo firegiant9000/Senior-Cybersecurity-Project \\
            --signer-workflow firegiant9000/Senior-Cybersecurity-Project/.github/workflows/agent-release.yml \\
            --source-ref ${GITHUB_REF} \\
            --deny-self-hosted-runners \\
            --predicate-type https://cyclonedx.org/bom
          \`\`\`

          Full instructions: https://github.com/firegiant9000/Senior-Cybersecurity-Project/blob/main/docs/security/agent_release_verification.md
          EOF
          cat body.md

      - name: Create draft release
        run: |
          set -euo pipefail
          if [ "${REHEARSE}" = "true" ]; then
            NAME="rehearsal-agent-${GITHUB_RUN_ID}"
          else
            NAME="${GITHUB_REF_NAME}"
          fi
          # Drafts are listed for a write token. Refuse to create a duplicate
          # (e.g. a re-run after a partial failure).
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name')"
          if grep -qxF -- "${NAME}" <<< "${EXISTING}"; then
            echo "::error::a release for ${NAME} already exists (possibly a draft); delete it before re-running"
            exit 1
          fi
          if [ "${REHEARSE}" = "true" ]; then
            # Rehearsal: a draft has no tag until it is published, and it is
            # never published, so no tag is ever created.
            gh release create "${NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --draft --target "${GITHUB_SHA}" \
              --title "Rehearsal agent ${VERSION} (run ${GITHUB_RUN_ID})" --notes-file body.md
          else
            gh release create "${NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
              --title "Hacker Tracker agent v${VERSION}" --notes-file body.md
          fi

  # Re-checks the draft exactly as a consumer would, then (tag runs only)
  # undrafts it. Runs for plain dispatches too (against the run artifact).
  verify:
    name: Verify attestations and publish
    needs: [build, publish]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # read the draft release and, on tag runs, undraft it
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      REHEARSE: ${{ inputs.rehearse }}
    steps:
      # An old runner gh that lacks a flag must fail loudly, never skip a check.
      - name: Check gh supports the verification flags
        run: |
          set -euo pipefail
          gh --version
          HELP="$(gh attestation verify --help)"
          for flag in --signer-workflow --source-ref --predicate-type; do
            grep -q -- "${flag}" <<< "${HELP}" || { echo "::error::gh lacks ${flag}"; exit 1; }
          done
          if grep -q -- "--source-digest" <<< "${HELP}"; then
            echo "SOURCE_DIGEST=1" >> "$GITHUB_ENV"
          fi

      - name: Download plain-dispatch artifact
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) && !inputs.rehearse }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-linux-${{ needs.build.outputs.version }}
          path: dl

      - name: Download draft release assets
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')) || inputs.rehearse }}
        run: |
          set -euo pipefail
          if [ "${REHEARSE}" = "true" ]; then
            NAME="rehearsal-agent-${GITHUB_RUN_ID}"
          else
            NAME="${GITHUB_REF_NAME}"
          fi
          mkdir -p dl
          if gh release download "${NAME}" --repo "${GITHUB_REPOSITORY}" --dir dl; then
            echo "Downloaded with: gh release download"
          else
            echo "gh release download could not see the draft; falling back to the releases API."
            rm -rf dl
            mkdir -p dl
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -r --arg n "${NAME}" '.[] | select(.tag_name == $n) | .assets[] | "\(.id) \(.name)"' > assets.txt
            test -s assets.txt || { echo "::error::no draft release assets found for ${NAME}"; exit 1; }
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "dl/${name}"
            done < assets.txt
            echo "Downloaded with: releases API fallback"
          fi

      - name: Assert file set and checksums
        working-directory: dl
        run: |
          set -euo pipefail
          ls -l
          EXPECTED="$(printf '%s\n' \
            "hacker-tracker-${VERSION}-linux-amd64" \
            "hacker-tracker-${VERSION}-linux-amd64.cdx.json" \
            "hacker-tracker-${VERSION}-linux-arm64" \
            "hacker-tracker-${VERSION}-linux-arm64.cdx.json" \
            SHA256SUMS | LC_ALL=C sort)"
          ACTUAL="$(find . -mindepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::unexpected file set"
            diff <(echo "${EXPECTED}") <(echo "${ACTUAL}") || true
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Verify provenance and SBOM attestations
        working-directory: dl
        run: |
          set -euo pipefail
          FLAGS=(--repo firegiant9000/Senior-Cybersecurity-Project
            --signer-workflow firegiant9000/Senior-Cybersecurity-Project/.github/workflows/agent-release.yml
            --source-ref "${GITHUB_REF}"
            --deny-self-hosted-runners)
          if [ "${SOURCE_DIGEST:-}" = "1" ]; then
            FLAGS+=(--source-digest "${GITHUB_SHA}")
          fi
          for b in "hacker-tracker-${VERSION}-linux-amd64" "hacker-tracker-${VERSION}-linux-arm64"; do
            echo "==> provenance: ${b}"
            gh attestation verify "${b}" "${FLAGS[@]}"
            echo "==> SBOM: ${b}"
            gh attestation verify "${b}" "${FLAGS[@]}" --predicate-type https://cyclonedx.org/bom
          done

          # Tamper self-test: a modified copy must NOT verify, which proves the
          # checks above are not vacuous.
          cp "hacker-tracker-${VERSION}-linux-amd64" tampered
          printf 'x' >> tampered
          if gh attestation verify tampered "${FLAGS[@]}"; then
            echo "::error::tampered binary verified"
            exit 1
          fi
          echo "Tampered binary correctly failed verification."

      # Last step: only reached when everything above passed.
      - name: Publish release (undraft)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')
        run: |
          set -euo pipefail
          if [[ "${VERSION}" == *-* ]]; then
            # Pre-release versions are never marked latest.
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          fi

  # A rehearsal must never leave a draft or a tag behind, even when publish or
  # verify failed (or was cancelled).
  cleanup-rehearsal:
    name: Delete rehearsal release
    needs: [publish, verify]
    if: always() && inputs.rehearse
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete rehearsal release
        run: |
          set -uo pipefail
          NAME="rehearsal-agent-${GITHUB_RUN_ID}"
          if OUT="$(gh release delete "${NAME}" --repo "${GITHUB_REPOSITORY}" --yes 2>&1)"; then
            echo "Deleted ${NAME}."
          elif grep -qi "not found" <<< "${OUT}"; then
            # gh could not see it by tag. Fall back to the API by release id, so
            # a draft that exists is never left behind by a lookup quirk.
            echo "gh: ${OUT}"
            IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" | jq -r --arg n "${NAME}" '.[] | select(.tag_name == $n) | .id')" || exit 1
            for id in ${IDS}; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || exit 1
              echo "Deleted draft release id ${id} via API."
            done
          else
            echo "::error::gh release delete failed: ${OUT}"
            exit 1
          fi

      - name: Assert no rehearsal tag remains
        run: |
          set -euo pipefail
          N="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/rehearsal-agent-${GITHUB_RUN_ID}" --jq length)"
          if [ "${N}" != "0" ]; then
            echo "::error::${N} rehearsal tag(s) left behind"
            exit 1
          fi
          echo "No rehearsal tag remains."

  # ── macOS notarization (DEFERRED — Month 6 macOS path) ─────────────────────
  # Stub only. When the macOS collectors land and the Apple Developer ID cert is
  # provisioned, add a `macos` job here that:
  #   1. builds darwin/amd64 + darwin/arm64,
  #   2. `codesign --options runtime` with the Developer ID Application cert,
  #   3. submits the zipped binary to `xcrun notarytool submit --wait`,
  #   4. `xcrun stapler staple` the ticket, then attaches to the release.
  # Tracked in docs/security/agent_release_verification.md ("macOS notarization (deferred)").
