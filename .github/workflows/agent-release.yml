# Builds, attests and releases the read-only Linux host scanner (agent/) on a
# tag push of the form `agent-vX.Y.Z`.
#
# Flow: build (vet, test, binary govulncheck, CycloneDX SBOMs, SHA256SUMS,
# SLSA build provenance + SBOM attestations) -> publish a DRAFT release ->
# verify the draft exactly as a consumer would (gh attestation verify, plus a
# tampered-binary self-test) -> undraft. No secrets are used; trust comes from
# GitHub's OIDC-backed attestations, not a long-lived signing key.
#
# Manual dispatch never creates a tag or a lasting release. A plain dispatch
# only builds and verifies the run artifact; `rehearse` also creates a draft
# release, verifies it, and deletes it again.
#
# How to verify a release: docs/security/agent_release_verification.md
name: Agent Release

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Rehearse the release path: creates a draft release, verifies it and deletes it again. Pushes no tag."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build, scan and attest Linux binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless signing for the attestations
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false # stdlib-only module, no go.sum to key a cache on

      # Derive the release version from the tag (agent-v0.2.0 -> 0.2.0). For a
      # manual dispatch with no tag we fall back to 0.0.0-dev so ldflags still
      # has a clean semver to stamp.
      - name: Resolve version
        id: version
        run: |
          REF="${GITHUB_REF}"
          if [[ "${REF}" == refs/tags/agent-v* ]]; then
            VERSION="${REF#refs/tags/agent-v}"
          else
            VERSION="0.0.0-dev"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag version '${VERSION}' is not a clean semver (expected agent-vX.Y.Z)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building agent version ${VERSION}"

      # Guard against scanner_version drift: the stamped tag must match the source
      # default in internal/output (the value the backend's MIN_AGENT_VERSION
      # gate compares against). Skip the check for dev dispatch builds.
      - name: Verify tag matches source ScannerVersion
        if: startsWith(github.ref, 'refs/tags/agent-v')
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SRC=$(grep -oE 'ScannerVersion = "[^"]+"' internal/output/json.go | grep -oE '[0-9][^"]*')
          if [ "${SRC}" != "${VERSION}" ]; then
            echo "::error::Tag agent-v${VERSION} != source ScannerVersion ${SRC}. Bump internal/output/json.go before tagging."
            exit 1
          fi
          echo "ScannerVersion ${SRC} matches tag."

      - name: Vet & test
        working-directory: agent
        run: |
          go vet ./...
          go test ./...

      - name: Build (linux/amd64 + linux/arm64)
        working-directory: agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dist"
          LDFLAGS="-s -w -X github.com/firegiant9000/hacker-tracker/agent/internal/output.ScannerVersion=${VERSION}"
          for arch in amd64 arm64; do
            out="${RUNNER_TEMP}/dist/hacker-tracker-${VERSION}-linux-${arch}"
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${out}" ./cmd/hacker-tracker
          done

      - name: Install govulncheck and cyclonedx-gomod
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Scans the shipped binaries themselves (the symbols they actually link),
      # not just the module graph. Blocking.
      - name: govulncheck (binaries)
        run: |
          set -euo pipefail
          for f in "${RUNNER_TEMP}"/dist/hacker-tracker-*-linux-*; do
            echo "==> ${f}"
            govulncheck -mode binary "${f}"
          done

      # `-version` overrides the "(devel)" main-module version that binaries
      # built from a checkout carry; check_sbom.py fails if it did not take.
      - name: CycloneDX SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          GOVERSION="$(go env GOVERSION)"
          for f in "${RUNNER_TEMP}"/dist/hacker-tracker-*-linux-*; do
            echo "==> ${f}.cdx.json"
            cyclonedx-gomod bin -json -std -version "v${VERSION}" -output "${f}.cdx.json" "${f}"
            python3 .github/scripts/check_sbom.py "${f}.cdx.json" --version "v${VERSION}" --go-version "${GOVERSION}"
          done

      - name: Generate checksums
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          sha256sum hacker-tracker-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64
            ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64

      - name: Attest SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64
          sbom-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-amd64.cdx.json

      - name: Attest SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64
          sbom-path: ${{ runner.temp }}/dist/hacker-tracker-${{ steps.version.outputs.version }}-linux-arm64.cdx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # ── macOS notarization (DEFERRED — Month 6 macOS path) ─────────────────────
  # Stub only. When the macOS collectors land and the Apple Developer ID cert is
  # provisioned, add a `macos` job here that:
  #   1. builds darwin/amd64 + darwin/arm64,
  #   2. `codesign --options runtime` with the Developer ID Application cert,
  #   3. submits the zipped binary to `xcrun notarytool submit --wait`,
  #   4. `xcrun stapler staple` the ticket, then attaches to the release.
  # Tracked in docs/security/agent_release_verification.md ("macOS notarization (deferred)").
