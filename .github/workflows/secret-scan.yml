name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # gitleaks only reads local history; don't leave GITHUB_TOKEN in the
          # git config while third-party scanner code runs (T-CI-04).
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action scans only `<range> --first-parent --no-merges` on push and PR
      # events, so commits that reach main through a merge are never scanned until
      # the weekly cron. Scan everything reachable from HEAD on every push and PR
      # as well (~15 s). Same gitleaks version as the action; honours .gitleaksignore.
      - name: gitleaks over all of HEAD's history (incl. merged commits)
        if: ${{ github.event_name != 'schedule' }}
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 # v8.24.3
        env:
          # The container user does not own the checkout; let git read it.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --redact --verbose --log-opts=HEAD /github/workspace
