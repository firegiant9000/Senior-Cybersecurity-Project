name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-exceptions:
    name: Scan exceptions (expiry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Test the exception checker
        run: python -m unittest discover -s .github/scripts

      - name: Check exception list (format and expiry)
        run: python .github/scripts/scan_exceptions.py check

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit locked dependencies (prod and dev)
        run: |
          ignore_args=()
          while IFS= read -r id; do
            [ -n "$id" ] && ignore_args+=(--ignore-vuln "$id")
          done < <(python .github/scripts/scan_exceptions.py ids pip-audit)
          echo "Ignoring ${#ignore_args[@]} argument(s): ${ignore_args[*]}"
          status=0
          for lock in backend/requirements.txt backend/requirements-dev.txt; do
            echo "::group::pip-audit $lock"
            pip-audit -r "$lock" --require-hashes --disable-pip --strict "${ignore_args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

  govulncheck:
    name: govulncheck (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false # stdlib-only module, no go.sum to key a cache on

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck
        run: govulncheck ./...

  npm-audit:
    name: npm audit (frontend, prod deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (blocking, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: npm audit
