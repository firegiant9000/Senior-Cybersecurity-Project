name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-exceptions:
    name: Scan exceptions and workflow pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Test the security scripts
        run: python -m unittest discover -s .github/scripts

      - name: Check exception list (format and expiry)
        if: ${{ !cancelled() }}
        run: python .github/scripts/scan_exceptions.py check

      - name: Check threat model (classifications and evidence)
        if: ${{ !cancelled() }}
        run: python .github/scripts/check_threat_model.py docs/security/threat_model.md

      - name: Check every action is pinned to a commit SHA
        if: ${{ !cancelled() }}
        run: |
          # grep exit codes: 0 = match (unpinned ref), 1 = no match (pass), >=2 = error (fail).
          rc=0
          grep -rnP '^\s*(-\s*)?uses:\s*(?![\x22\x27]?(\./|docker://))[^@\s]+@(?![0-9a-f]{40}\b)' .github/workflows || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Unpinned action reference(s) above. Pin each 'uses:' to a 40-hex commit SHA."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed (exit $rc); cannot verify action pins."
            exit 1
          fi
          # docker:// refs must be pinned by image digest.
          rc=0
          grep -rnP '^\s*(-\s*)?uses:\s*[\x22\x27]?docker://(?![^\s\x22\x27]*@sha256:[0-9a-f]{64})' .github/workflows || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::docker:// reference(s) above are not pinned by @sha256 digest."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed (exit $rc); cannot verify docker pins."
            exit 1
          fi
          # ZAP_IMAGE (used by `docker run`) must be pinned by image digest.
          rc=0
          grep -rnP '^\s*ZAP_IMAGE:[ \t]*+(?!\S+@sha256:[0-9a-f]{64}\s*$)' .github/workflows || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::ZAP_IMAGE above is not pinned by @sha256 digest."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed (exit $rc); cannot verify ZAP image pin."
            exit 1
          fi

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit locked dependencies (prod and dev)
        run: |
          ignore_args=()
          while IFS= read -r id; do
            [ -n "$id" ] && ignore_args+=(--ignore-vuln "$id")
          done < <(python .github/scripts/scan_exceptions.py ids pip-audit)
          echo "Ignoring ${#ignore_args[@]} argument(s): ${ignore_args[*]}"
          status=0
          for lock in backend/requirements.txt backend/requirements-dev.txt; do
            echo "::group::pip-audit $lock"
            pip-audit -r "$lock" --require-hashes --disable-pip --strict "${ignore_args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

  govulncheck:
    name: govulncheck (agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false # stdlib-only module, no go.sum to key a cache on

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: govulncheck
        run: govulncheck ./...

  trivy:
    name: Trivy (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build backend image
        run: docker build --platform linux/amd64 -t ht-backend:ci backend

      - name: Generate .trivyignore from scan_exceptions.md
        run: python .github/scripts/scan_exceptions.py ids trivy > .trivyignore

      # trivy-action v0.36.0 (immutable release, published after the March 2026
      # tag-compromise incident, GHSA-69fq-xp46-6x23). The Trivy binary version
      # is pinned explicitly; never v0.69.4, v0.69.5 or v0.69.6.
      - name: Trivy (blocking, fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ht-backend:ci
          # Bumped by hand: Dependabot does not track this input. When bumping the
          # action SHA, also check the trivy releases and move this version.
          version: v0.76.0
          cache: false # no Actions-cache restore of the Trivy binary or vulnerability DB
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

      - name: Trivy (report only, all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Point the ignore file at /dev/null so the report also shows excepted IDs
        # (Trivy would otherwise read ./.trivyignore; the action only overrides this
        # env var when the trivyignores input is set).
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: ht-backend:ci
          skip-setup-trivy: true
          cache: false
          format: table
          ignore-unfixed: false
          exit-code: 0

  zap-baseline:
    name: ZAP baseline (local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ht-zap
      # ZAP stable, resolved 2026-11-12 (ghcr.io/zaproxy/zaproxy:stable). Bump by hand.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # zap_gate.py uses `str | None` annotations, so it needs Python 3.10+.
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # The override uses !reset / !override, which need Compose >= 2.24.
      - name: Record Docker Compose version
        run: docker compose version

      # The base file's env_file entries are required, so they must exist (empty).
      - name: Create empty env files
        run: touch backend/.env frontend/.env

      - name: Start postgres and backend (CI override)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait postgres backend

      # zap-baseline.py spiders only from -t, so this hook (loaded via --hook) requests
      # the unauthenticated seed URLs first; ZAP passively scans every response.
      - name: Write ZAP seed hook
        run: |
          rm -rf zap-wrk
          mkdir -p zap-wrk
          cat > zap-wrk/seed_hook.py <<'EOF'
          SEEDS = [
              "/",
              "/health",
              "/api/v1/ingest/health",
              "/api/v1/public/stats",
              "/api/v1/data-status",
              "/docs",
          ]


          def zap_started(zap, target):
              wanted = [target.rstrip("/") + p for p in SEEDS]
              for url in wanted:
                  zap.core.access_url(url, followredirects="true")
              # Marker file: written only if every seed is in ZAP's site tree.
              seen = set(zap.core.urls())
              if all(url in seen for url in wanted):
                  open("/zap/wrk/seeds.ok", "w").close()
          EOF
          # The ZAP container runs as uid 1000 and must write the reports here.
          chmod a+w zap-wrk

      # -I: ZAP's own exit code never fails the step; zap_gate.py decides.
      - name: ZAP baseline scan
        run: >
          docker run --rm
          --network ht-zap_cyber_threat_network
          -v "$PWD/zap-wrk:/zap/wrk:rw"
          "$ZAP_IMAGE"
          zap-baseline.py -t http://backend:8000 -J zap-report.json -r zap-report.html
          --hook /zap/wrk/seed_hook.py -I

      # Fail loudly if the hook did not run or a seed was not requested, so the job
      # cannot pass with less coverage than intended.
      - name: Check all seed URLs were requested
        run: test -f zap-wrk/seeds.ok

      - name: Check exception list (format and expiry)
        run: python .github/scripts/scan_exceptions.py check

      - name: Gate on medium and above
        run: python .github/scripts/zap_gate.py zap-wrk/zap-report.json docs/security/scan_exceptions.md

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            zap-wrk/zap-report.json
            zap-wrk/zap-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  npm-audit:
    name: npm audit (frontend, prod deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (blocking, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: npm audit
