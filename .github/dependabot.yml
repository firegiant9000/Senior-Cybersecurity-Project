# Dependabot: one pull request a month covering pip, npm, gomod and GitHub Actions.
# The backend base image (docker) is the exception: it is checked weekly, because the
# Trivy gate needs base-digest bumps faster than monthly.
#
# - All minor and patch updates land together in a single "monthly-dependencies" PR.
# - Major version bumps of libraries are ignored here; take those deliberately
#   in their own branch. GitHub Actions majors are included (they rarely break).
# - Security updates are separate: Dependabot opens those as soon as an
#   advisory affects a dependency, regardless of this schedule.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/configuring-multi-ecosystem-updates
version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gomod"
    directory: "/agent"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Not in the monthly group: the Trivy gate needs base-image digest bumps sooner.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
